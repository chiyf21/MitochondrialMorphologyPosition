<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FISH2 分区校正</title>
<style>
:root{font-family:Inter,"Microsoft YaHei UI",sans-serif;color:#172530;background:#f4f7f8}
*{box-sizing:border-box} body{margin:0} header{padding:17px 23px;background:white;border-bottom:1px solid #dce4e8;display:flex;align-items:center;justify-content:space-between;gap:18px}
h1{font-size:22px;margin:0} #progress,#detail,#message{font-size:13px;color:#485e69}
main{display:grid;grid-template-columns:255px minmax(0,1fr);height:calc(100vh - 63px)}
aside{padding:14px;background:#f8fbfc;border-right:1px solid #dce4e8;overflow:auto}
#panel{padding-top:12px;display:grid;gap:5px} #panel button{text-align:left;display:grid;gap:4px}
button,select,input{font:inherit;border:1px solid #c9d5db;background:white;color:inherit;border-radius:7px;padding:7px 9px}
button{cursor:pointer} button:hover:not(:disabled){background:#edf4f7} button:disabled{cursor:default;opacity:.5}
button.current{border-color:#327584;background:#e2f0f3} button.primary{background:#155965;color:white;border-color:#155965} button.primary:hover:not(:disabled){background:#114952}
small{font-size:12px;color:#506674} .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:white;border-bottom:1px solid #e0e8eb}
#workspace{display:flex;flex-direction:column;min-width:0;min-height:0} #plot{flex:1;min-height:250px;width:100%;display:block;touch-action:none;cursor:grab} #plot:active{cursor:grabbing} #legend{padding:5px 14px;font-size:12px} #legend button{padding:3px 6px} #legend button[aria-pressed="false"]{opacity:.5} #message{min-height:36px;padding:8px 14px;background:white} #radius{width:76px}
@media(max-width:760px){main{grid-template-columns:160px minmax(0,1fr)}header{padding:10px}aside{padding:8px}}
</style>
</head>
<body>
<header><h1>FISH2 分区校正</h1><div id="progress" aria-live="polite"></div></header>
<main>
<aside>
<div class="bar" style="padding:0;border:0;background:none">
<select id="type" aria-label="细胞类型"><option value="">全部类型</option></select>
<button id="refresh">刷新</button>
<input id="search" placeholder="查找 body ID" aria-label="查找 body ID" style="width:100%">
<label><input id="onlyOpen" type="checkbox"> 只看待校正</label>
</div>
<div id="panel"></div>
</aside>
<section id="workspace">
<div class="bar"><strong id="bodyTitle">选择一个神经元</strong><span id="detail"></span></div>
<div class="bar">
<label>点选 <select id="mode">
<option value="chain">无分叉骨架段</option><option value="edge">单条边</option>
<option value="path">两点之间的路径</option><option value="region">连通的同标签区域</option>
<option value="radius">半径内的边</option>
</select></label>
<label id="radiusWrap" hidden>半径 µm <input id="radius" type="number" min=".1" step=".1" value="3"></label>
<label><input type="checkbox" id="pick" checked> 可选边</label>
<button id="clear">清除选择</button><span id="selection">选中 0 条</span>
</div>
<div class="bar">
<label>标签 <select id="label"></select></label>
<button id="apply" disabled>应用标签</button>
<button id="undo" disabled>撤销</button>
<button id="draft" disabled>保存草稿</button>
<button id="correct" class="primary" disabled>标记为已校正</button>
<button id="next">下一个待校正</button>
</div>
<div id="legend" class="bar"><button id="resetView">重置视角</button></div>
<canvas id="plot" aria-label="可旋转、缩放和选择骨架边的神经元视图"></canvas>
<div id="message" aria-live="polite">拖动旋转，滚轮缩放，Shift + 拖动平移。点击骨架选边。</div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
const plot = $("plot");
const styles = {
  axon:["轴突","#e57224"], dendrite:["树突","#2879bc"], soma:["胞体","#b02870"],
  cell_body_fiber:["胞体纤维","#368456"], connecting_cable:["连接段","#7955b6"],
  ambiguous:["待定","#94845f"]
};
const names = {pending:"待计算", ready:"待校正", draft:"有草稿", corrected:"已校正",
               corrected_with_draft:"已校正 · 有新草稿", error:"计算失败"};
let panel = [], body = null, model = null, changes = new Map(), selected = new Set(), undo = [];
let anchor = null, dirty = false, busy = false, loadID = 0;
let adjacency = [], midpoints = [], projected = [], center = [0,0,0], extent = 1;
const ctx = plot.getContext("2d");
const hidden = new Set(["pre", "post"]);
let yaw = .70, pitch = -.36, zoom = 1, panX = 0, panY = 0;
let frame = 0, dragging = null;
const synapseColors = {pre:"#d74a26", post:"#1975be"};

function say(message){ $("message").textContent = message; }
async function api(path, options){
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}
function current(i){ return changes.get(i) ?? model.labels[i]; }
function unresolved(){
  return model ? model.labels.reduce((n, _, i) => n + Number(current(i) === "ambiguous"), 0) : 0;
}
function updateControls(){
  $("selection").textContent = "选中 " + selected.size.toLocaleString() + " 条";
  $("apply").disabled = busy || !model || !selected.size;
  $("undo").disabled = busy || !undo.length;
  $("draft").disabled = busy || !model || !dirty;
  $("correct").disabled = busy || !model || (model.corrected && !model.draft && !dirty);
  if (model) {
    $("detail").textContent = "待定 " + unresolved().toLocaleString() + " 条 · " +
      (dirty ? "有未保存修改" : model.draft ? "草稿已保存" : model.corrected ? "已校正" : "V3 Step 05 自动候选") +
      " · Step 01 主分支 " + (model.detail.step01_arbors.pair_confidence === "high" ? "配对成功" : "未配对");
  }
}
function renderPanel(){
  const filter = $("type").value, query = $("search").value.trim();
  const rows = panel.filter(row => (!filter || row.cell_type === filter) &&
    (!query || String(row.body_id).includes(query)) && (!$("onlyOpen").checked || row.state !== "corrected"));
  $("panel").replaceChildren(...rows.map(row => {
    const button = document.createElement("button");
    button.disabled = row.state === "pending" || row.state === "error";
    button.className = row.body_id === body ? "current" : "";
    button.textContent = row.cell_type + " · " + row.body_id;
    const note = document.createElement("small");
    note.textContent = names[row.state] + (button.disabled ? "" : " · 待定 " + row.ambiguous.toLocaleString());
    if (row.error) button.title = row.error;
    button.append(note);
    button.onclick = () => loadBody(row.body_id);
    return button;
  }));
  const ready = panel.filter(row => !["pending","error"].includes(row.state)).length;
  const corrected = panel.filter(row => row.state.startsWith("corrected")).length;
  const errors = panel.filter(row => row.state === "error").length;
  $("progress").textContent = "自动候选 " + ready + " / " + panel.length +
    " · 已校正 " + corrected + (errors ? " · 失败 " + errors : "");
}
async function refresh(){
  panel = await api("/api/panel");
  const available = new Set([...$("type").options].map(o => o.value));
  for(const row of panel) if(!available.has(row.cell_type)){
    $("type").add(new Option(row.cell_type,row.cell_type)); available.add(row.cell_type);
  }
  renderPanel();
}
function resetView(){
  yaw=.70; pitch=-.36; zoom=1; panX=0; panY=0; scheduleDraw();
}
function scheduleDraw(){
  if(!frame) frame=requestAnimationFrame(()=>{frame=0;draw();});
}
function render(reset=false){
  if(reset) resetView();
  updateControls();
  scheduleDraw();
}
function highlight(){ render(); }
function draw(){
  if(!model) return;
  const w=plot.clientWidth,h=plot.clientHeight,dpr=Math.min(window.devicePixelRatio||1,2);
  const width=Math.round(w*dpr),height=Math.round(h*dpr);
  if(plot.width!==width || plot.height!==height){plot.width=width;plot.height=height;}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const c=Math.cos(yaw),s=Math.sin(yaw),q=Math.cos(pitch),t=Math.sin(pitch);
  const scale=Math.min(w,h)*.84*zoom/extent;
  function project(p){
    const x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2];
    const u=c*x-s*y,v=s*x+c*y;
    return [w/2+panX+scale*u,h/2+panY-scale*(q*z-t*v),q*v+t*z];
  }
  projected=model.xyz.map(project);
  const stride=dragging?.moved ? Math.max(1,Math.ceil(model.edges.length/6500)) : 1;
  const groups={};
  for(let i=0;i<model.edges.length;i+=stride){
    const label=current(i);
    if(hidden.has(label)) continue;
    const key=label+(i>=model.original_edges?"_bridge":"");
    (groups[key]??=[]).push(i);
  }
  function stroke(ids,color,width,dash){
    ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);
    for(const i of ids){
      const [a,b]=model.edges[i].map(v=>projected[v]);
      ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
    }
    ctx.stroke();
  }
  for(const [key,ids] of Object.entries(groups)){
    const bridge=key.endsWith("_bridge");
    stroke(ids,styles[key.replace("_bridge","")][1],bridge?1.2:1.35,bridge?[3,3]:[]);
  }
  stroke(selected,"#08a892",3.5,[]);
  for(const role of ["pre","post"]) if(!hidden.has(role)){
    ctx.beginPath();ctx.fillStyle=synapseColors[role];
    for(const p of model.synapses[role]){
      const [x,y]=project(p);ctx.moveTo(x+2.8,y);ctx.arc(x,y,2.8,0,2*Math.PI);
    }
    ctx.fill();
  }
}
function nearestEdge(x,y){
  let hit=null,best=9**2,depth=-Infinity;
  for(let i=0;i<model.edges.length;i++){
    if(hidden.has(current(i))) continue;
    const [a,b]=model.edges[i].map(v=>projected[v]);
    const dx=b[0]-a[0],dy=b[1]-a[1],length=dx*dx+dy*dy;
    const t=length?Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/length)):0;
    const d=(x-a[0]-t*dx)**2+(y-a[1]-t*dy)**2,z=a[2]+t*(b[2]-a[2]);
    if(d<best-.25 || (d<=best+.25 && z>depth)){hit=i;best=d;depth=z;}
  }
  return hit;
}
plot.addEventListener("pointerdown",e=>{
  if(!model || e.button!==0)return;
  dragging={x:e.clientX,y:e.clientY,moved:false,pan:e.shiftKey};
  plot.setPointerCapture(e.pointerId);
});
plot.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const dx=e.clientX-dragging.x,dy=e.clientY-dragging.y;
  if(!dragging.moved && Math.hypot(dx,dy)<3)return;
  dragging.moved=true;dragging.x=e.clientX;dragging.y=e.clientY;
  if(dragging.pan){panX+=dx;panY+=dy;}
  else {yaw+=dx*.009;pitch=Math.max(-1.55,Math.min(1.55,pitch+dy*.009));}
  scheduleDraw();
});
plot.addEventListener("pointerup",e=>{
  if(!dragging)return;
  const wasDrag=dragging.moved;dragging=null;
  if(!wasDrag && model && projected.length===model.xyz.length){
    const rect=plot.getBoundingClientRect();
    const edge=nearestEdge(e.clientX-rect.left,e.clientY-rect.top);
    if(edge!==null)pickEdge(edge);
  }
  scheduleDraw();
});
plot.addEventListener("pointercancel",()=>{dragging=null;scheduleDraw();});
plot.addEventListener("wheel",e=>{
  e.preventDefault(); zoom=Math.max(.2,Math.min(30,zoom*Math.exp(-e.deltaY*.001)));scheduleDraw();
},{passive:false});
new ResizeObserver(scheduleDraw).observe(plot);
$("resetView").onclick=resetView;
for(const [key,[label,color]] of Object.entries({...styles,pre:["PRE 突触",synapseColors.pre],post:["POST 突触",synapseColors.post]})){
  const b=document.createElement("button");
  b.textContent="● "+label;b.style.color=color;b.setAttribute("aria-pressed",String(!hidden.has(key)));
  b.onclick=()=>{hidden.has(key)?hidden.delete(key):hidden.add(key);b.setAttribute("aria-pressed",String(!hidden.has(key)));scheduleDraw();};
  $("legend").append(b);
}
function pathEdges(start,end){
  const previous = new Map([[start,-1]]), queue=[start];
  for(const i of queue){
    if(i===end) break;
    for(const v of model.edges[i]) for(const e of adjacency[v])
      if(!previous.has(e)){previous.set(e,i);queue.push(e);}
  }
  if(!previous.has(end)) return [];
  const out=[];
  for(let i=end; i!==-1; i=previous.get(i)) out.push(i);
  return out;
}
function pickEdge(i){
  if(!model || busy || !$("pick").checked) return;
  const mode = $("mode").value;
  let group=[i];
  if(mode==="path"){
    if(anchor===null){anchor=i;selected.add(i);highlight();say("已选起点。请点路径终点。");return;}
    group=pathEdges(anchor,i); selected.delete(anchor);anchor=null;
    if(!group.length) say("这两条边之间没有连通路径。");
  } else if(mode==="radius"){
    const [x,y,z]=midpoints[i], r=Math.max(.1,Number($("radius").value)||.1);
    group=midpoints.flatMap(([a,b,c],j) => (a-x)**2+(b-y)**2+(c-z)**2<=r*r?[j]:[]);
  } else if(mode!=="edge"){
    const seen=new Set(group);
    for(const e of group) for(const v of model.edges[e]){
      if(mode==="chain" && adjacency[v].length!==2) continue;
      for(const j of adjacency[v]) if(!seen.has(j) && (mode==="chain" || current(j)===current(i))){
        seen.add(j);group.push(j);
      }
    }
  }
  const remove=group.length && group.every(e=>selected.has(e));
  for(const e of group) remove?selected.delete(e):selected.add(e);
  highlight();
}
async function loadBody(id){
  if(busy || (dirty && !confirm("这只神经元有未保存的修改。仍要切换吗？"))) return;
  const ticket=++loadID;
  say("正在加载骨架…");
  try{
    const data=await api("/api/body/"+id);
    if(ticket!==loadID) return;
    body=id;model=data;changes=new Map(data.changes);selected=new Set();undo=[];anchor=null;dirty=false;
    projected=[];
    const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
    for(const p of data.xyz) for(let j=0;j<3;j++){lo[j]=Math.min(lo[j],p[j]);hi[j]=Math.max(hi[j],p[j]);}
    center=lo.map((v,j)=>(v+hi[j])/2);
    extent=Math.max(1,Math.hypot(...hi.map((v,j)=>v-lo[j])));
    adjacency=Array.from({length:data.xyz.length},()=>[]);
    midpoints=data.edges.map(([u,v],i)=>{
      adjacency[u].push(i);adjacency[v].push(i);
      return data.xyz[u].map((x,j)=>(x+data.xyz[v][j])/2);
    });
    $("bodyTitle").textContent=data.detail.cell_type+" · "+id;
    renderPanel();
    await render(true);
    say("点击骨架选边，再选择标签并点击「应用标签」。拖动旋转，Shift + 拖动平移。");
  }catch(error){say(error.message);}
}
async function save(action){
  if(!model || busy) return;
  if(action==="corrected" && unresolved() &&
     !confirm("还有 "+unresolved()+" 条待定边。确认按当前标签标记为已校正？")) return;
  busy=true;updateControls();
  try{
    const record=await api("/api/body/"+body,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action,revision:model.revision,changes:[...changes]})});
    model.revision=record.revision;model.draft=action==="draft";model.corrected=model.corrected||action==="corrected";
    dirty=false;undo=[];changes=new Map(record.changes);
    say(action==="corrected"?"已保存校正结果。":"草稿已保存，可以稍后继续。");
    await refresh();
  }catch(error){say(error.message);}
  finally{busy=false;updateControls();}
}
$("type").onchange=$("search").oninput=$("onlyOpen").onchange=renderPanel;
$("refresh").onclick=()=>refresh().catch(e=>say(e.message));
$("mode").onchange=()=>{anchor=null;$("radiusWrap").hidden=$("mode").value!=="radius";};
$("pick").onchange=()=>model&&render();
$("clear").onclick=()=>{selected.clear();anchor=null;if(model)highlight();};
for(const [key,[text]] of Object.entries(styles)) $("label").add(new Option(text,key));
$("apply").onclick=()=>{
  const label=$("label").value;
  const affected=[...selected].filter(i=>current(i)!==label);
  if(!affected.length) return;
  undo.push(affected.map(i=>[i,changes.get(i)]));
  for(const i of affected) if(model.labels[i]===label)changes.delete(i);else changes.set(i,label);
  selected.clear();anchor=null;dirty=true;render();
};
$("undo").onclick=()=>{
  const snapshot=undo.pop();
  if(!snapshot) return;
  for(const [i,label] of snapshot) if(label===undefined)changes.delete(i);else changes.set(i,label);
  dirty=true;render();
};
$("draft").onclick=()=>save("draft");
$("correct").onclick=()=>save("corrected");
$("next").onclick=()=>{
  const current=panel.findIndex(r=>r.body_id===body);
  const eligible=r=>r.body_id!==body && ["ready","draft","corrected_with_draft"].includes(r.state) &&
    (!$("type").value || r.cell_type===$("type").value);
  const next=panel.slice(current+1).find(eligible)||panel.find(eligible);
  if(next)loadBody(next.body_id);else say("当前类型没有其他可校正样本。");
};
window.addEventListener("beforeunload",event=>{if(dirty){event.preventDefault();event.returnValue="";}});
refresh().then(()=>{
  const first=panel.find(r=>r.body_id===100076106&&r.state==="ready")||panel.find(r=>r.state==="ready");
  if(first)loadBody(first.body_id);
}).catch(error=>say(error.message));
setInterval(()=>refresh().catch(()=>{}),30000);
</script>
</body>
</html>
